name: formula
on:
  push:
    branches: [main]
  pull_request:
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  install:
    name: brew install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest does NOT have brew on PATH (measured: exit 127).
      # Homebrew's own setup action fixes that on Linux and is a no-op
      # where brew already works.
      - uses: Homebrew/actions/setup-homebrew@master
      # setup-homebrew detects a tap repo and makes THIS CHECKOUT the tap
      # (measured: an explicit overlay cp failed src==dst on both OS), so
      # every run — including PRs — tests its own commit. Just install.
      - name: Install exactly as a user would
        run: brew install termaxa/tap/termaxa
      - name: Verify it runs
        run: |
          termaxa --version
          termaxa check "rm -rf /tmp/x" || true
